<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emme Enojado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Oxygen+Mono&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg-1: #0b2638;
      --bg-2: #071827;
      --bg-3: #04101c;
      --line: rgba(255, 255, 255, 0.18);
      --mist: rgba(255, 255, 255, 0.78);
      --card: rgba(255, 255, 255, 0.1);
      --card-strong: rgba(255, 255, 255, 0.16);
      --font-main: "Instrument Sans", sans-serif;
      --font-accent: "Oxygen Mono", monospace;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100vh;
      overflow: hidden;
      color: var(--mist);
      font-family: var(--font-main); /* changed from EB Garamond */
      background:
        radial-gradient(circle at 50% 12%, rgba(58, 150, 185, 0.3), transparent 34%),
        radial-gradient(circle at 20% 88%, rgba(181, 205, 210, 0.12), transparent 30%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 58%, var(--bg-3) 100%);
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 28px;
      backdrop-filter: blur(12px);
    }

    header h1 {
      margin: 0;
      color: #fff;
      font-size: 1.45rem;
      font-weight: 400;
      letter-spacing: 0.06em;
    }

    header nav ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      gap: 16px;
    }

    header nav a {
      color: rgba(255, 255, 255, 0.78);
      text-decoration: none;
      font-size: 0.98rem;
    }

    header nav a:hover { color: #fff; }

    main#projectCanvas {
      position: relative;
      width: 100vw;
      height: 100vh;
      padding-top: 74px;
      isolation: isolate;
    }

    .node {
      position: absolute;
      left: var(--x);
      top: var(--y);
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    .node-label {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(0);
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
      z-index: 1;
      opacity: 1;
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .node-label-title {
      margin: 0;
      font-family: var(--font-main);
      font-size: 16px;
      line-height: 1.2;
      color: #fff;
    }

    .node-label-tags {
      margin: 3px 0 0;
      font-family: var(--font-accent); /* Oxygen Mono */
      font-size: 12px;
      line-height: 1.2;
      letter-spacing: 0.02em;
      text-transform: uppercase; /* added */
      color: rgba(255, 255, 255, 0.78);
    }

    .node-btn {
      position: relative;
      width: 16px;
      height: 16px;
      border: 1px solid rgba(255, 255, 255, 0.62);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      cursor: pointer;
      animation: float var(--dur, 6.8s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .node-btn:hover,
    .node-btn:focus-visible {
      transform: scale(1.12);
      background: rgba(255, 255, 255, 0.34);
      box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.12);
      outline: none;
    }

    .node-card {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 8px); /* card sits ~8px above node */
      transform: translateX(-50%) translateY(8px);
      width: 500px;
      height: 400px;
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 8px;
      background: #0b1228;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease, transform 220ms ease; /* keep existing timing */
      white-space: normal;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.28);
    }

    .node-card-media {
      width: 100%;
      height: 269px;
      background: linear-gradient(180deg, #121a36 0%, #121a33 100%);
    }

    .node-card-content {
      padding: 24px;
      background: rgba(3, 10, 30, 0.95);
    }

    .node-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px; /* 16px above description */
    }

    .node-card .name {
      margin: 0;
      font-family: var(--font-main); /* Instrument Sans */
      font-size: 24px;
      font-weight: 400;
      line-height: 1.2;
      color: #fff;
    }

    .node-card .desc {
      margin: 0;
      font-family: var(--font-main); /* Instrument Sans */
      font-size: 16px;
      font-weight: 400;
      line-height: 1.2; /* 120% */
      color: rgba(255, 255, 255, 0.92);
      max-width: 520px;
    }

    .node-card .tag-pill {
      margin: 0;
      padding: 8px 12px; /* 8px vertical, 12px horizontal */
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 16px;
      font-family: var(--font-accent); /* Oxygen Mono */
      font-size: 12px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.95);
      white-space: nowrap;
    }

    /* show hover card smoothly */
    .node:hover .node-card,
    .node:focus-within .node-card {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* hide default title/tags while hovering/focusing node */
    .node:hover .node-label,
    .node:focus-within .node-label {
      opacity: 0;
      transform: translateX(-50%) translateY(-6px);
    }

    .weather-card {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 25;
      width: 180px;
      padding: 12px 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      backdrop-filter: blur(12px);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
    }

    .weather-title {
      margin: 0 0 8px;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.68);
    }

    #weatherStatus {
      margin: 0;
      font-size: 0.88rem;
      color: rgba(255, 255, 255, 0.84);
      line-height: 1.35;
    }

    .weather-emoji { font-size: 1.2rem; }
    .weather-temp { font-size: 1.2rem; color: #fff; display: inline; }
    .weather-desc, .weather-meta { font-size: 0.82rem; color: rgba(255,255,255,.76); }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.46);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-panel {
      width: min(560px, calc(100vw - 28px));
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(11, 29, 42, 0.94);
      backdrop-filter: blur(10px);
      padding: 20px 20px 18px;
    }

    .modal-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .modal-title {
      margin: 0;
      color: #fff;
      font-size: 1.6rem;
      font-weight: 400;
      line-height: 1.1;
    }

    .modal-tag {
      margin: 6px 0 0;
      font-family: var(--font-accent); /* Oxygen Mono */
      font-size: 12px; /* changed from 0.85rem */
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.72);
    }

    .modal-close {
      border: 1px solid var(--line);
      background: transparent;
      color: #fff;
      border-radius: 10px;
      padding: 6px 10px;
      cursor: pointer;
      font: inherit;
    }

    .modal-desc {
      margin: 0;
      color: rgba(255, 255, 255, 0.86);
      font-size: 1.02rem;
      line-height: 1.5;
    }

    @keyframes float {
      0%, 100% { transform: translateY(-2px); }
      50% { transform: translateY(6px); }
    }

    @media (max-width: 720px) {
      header { padding: 16px 14px; }
      header nav { display: none; }
      .weather-card { width: 160px; right: 10px; bottom: 10px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Emme Enojado</h1>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="work.html">Work</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="projectCanvas" aria-label="Interactive project map"></main>

  <section class="weather-card" id="weatherCard" aria-live="polite">
    <h2 class="weather-title">Local Weather</h2>
    <p id="weatherStatus">Finding your garden skies…</p>
  </section>

  <section class="modal" id="projectModal" aria-hidden="true">
    <article class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-top">
        <div>
          <h2 class="modal-title" id="modalTitle">Project</h2>
          <p class="modal-tag" id="modalTag">Tag</p>
        </div>
        <button class="modal-close" id="modalClose" type="button" aria-label="Close project details">Close</button>
      </div>
      <p class="modal-desc" id="modalDesc">
        Placeholder description.
      </p>
    </article>
  </section>

  <script>
    (function () {
      const projects = [
        { name: "Project One", tags: ["Brand"], desc: "Placeholder description for Project One. Add your final copy later." },
        { name: "Project Two", tags: ["Web"], desc: "Placeholder description for Project Two. Add your final copy later." },
        { name: "Project Three", tags: ["UX"], desc: "Placeholder description for Project Three. Add your final copy later." },
        { name: "Project Four", tags: ["Campaign"], desc: "Placeholder description for Project Four. Add your final copy later." },
        { name: "Project Five", tags: ["Identity"], desc: "Placeholder description for Project Five. Add your final copy later." },
        { name: "Project Six", tags: ["Motion"], desc: "Placeholder description for Project Six. Add your final copy later." }
      ];

      const canvas = document.getElementById("projectCanvas");
      const modal = document.getElementById("projectModal");
      const modalTitle = document.getElementById("modalTitle");
      const modalTag = document.getElementById("modalTag");
      const modalDesc = document.getElementById("modalDesc");
      const modalClose = document.getElementById("modalClose");

      function clamp(val, min, max) {
        return Math.max(min, Math.min(max, val));
      }

      function toTagsText(tags) {
        if (Array.isArray(tags)) return tags.join(" • ");
        return String(tags || "");
      }

      function buildPositions() {
        const cols = 3;
        const rows = 2;
        return projects.map((_, i) => {
          const col = i % cols;
          const row = Math.floor(i / cols);
          const cellW = 100 / cols;
          const cellH = 82 / rows; // keep below header
          const jitterX = (Math.random() * 14) - 7;
          const jitterY = (Math.random() * 18) - 9;
          const x = clamp((col + 0.5) * cellW + jitterX, 8, 92);
          const y = clamp((row + 0.5) * cellH + 11 + jitterY, 20, 88);
          return { x, y };
        });
      }

      function openModal(project) {
        modalTitle.textContent = project.name;
        modalTag.textContent = toTagsText(project.tags);
        modalDesc.textContent = project.desc;
        modal.classList.add("open");
        modal.setAttribute("aria-hidden", "false");
      }

      function closeModal() {
        modal.classList.remove("open");
        modal.setAttribute("aria-hidden", "true");
      }

      function renderNodes() {
        canvas.innerHTML = "";
        const positions = buildPositions();

        projects.forEach((project, i) => {
          const wrap = document.createElement("div");
          wrap.className = "node";
          wrap.style.setProperty("--x", positions[i].x + "%");
          wrap.style.setProperty("--y", positions[i].y + "%");
          wrap.style.setProperty("--delay", (-i * 0.42) + "s");
          wrap.style.setProperty("--dur", (6 + (i % 3) * 1.1) + "s");

          const tagsText = toTagsText(project.tags);

          const label = document.createElement("div");
          label.className = "node-label";
          label.innerHTML = `
            <p class="node-label-title">${project.name}</p>
            <p class="node-label-tags">${tagsText}</p>
          `;

          const btn = document.createElement("button");
          btn.className = "node-btn";
          btn.type = "button";
          btn.setAttribute("aria-label", `${project.name} (${tagsText})`);
          btn.addEventListener("click", () => openModal(project));

          const card = document.createElement("div");
          card.className = "node-card";
          card.innerHTML = `
            <div class="node-card-media" aria-hidden="true"></div>
            <div class="node-card-content">
              <div class="node-card-header">
                <p class="name">${project.name}</p>
                <p class="tag-pill">${tagsText}</p>
              </div>
              <p class="desc">${project.desc}</p>
            </div>
          `;

          wrap.appendChild(label);
          wrap.appendChild(btn);
          wrap.appendChild(card);
          canvas.appendChild(wrap);
        });
      }

      modalClose.addEventListener("click", closeModal);
      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      renderNodes();

      // Weather widget (kept from your existing site)
      const statusEl = document.getElementById("weatherStatus");

      function weatherCodeToUi(code) {
        if (code === 0) return ["☀️", "Clear"];
        if ([1, 2, 3].includes(code)) return ["⛅️", "Partly cloudy"];
        if ([45, 48].includes(code)) return ["🌫️", "Fog"];
        if ([51, 53, 55, 56, 57].includes(code)) return ["🌦️", "Drizzle"];
        if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return ["🌧️", "Rain"];
        if ([71, 73, 75, 77, 85, 86].includes(code)) return ["❄️", "Snow"];
        if ([95, 96, 99].includes(code)) return ["⛈️", "Thunderstorm"];
        return ["🌤️", "Weather"];
      }

      function showError(msg) {
        statusEl.textContent = msg;
      }

      if (!navigator.geolocation) {
        showError("Geolocation is not supported in this browser.");
        return;
      }

      const loadingGuard = setTimeout(() => {
        showError("Enable location to see your weather.");
      }, 12000);

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          try {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const url =
              `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
              `&current=temperature_2m,weather_code&temperature_unit=fahrenheit`;
            const res = await fetch(url);
            if (!res.ok) throw new Error("Weather request failed");
            const data = await res.json();

            const temp = Math.round(data.current.temperature_2m);
            const code = data.current.weather_code;
            const [emoji, label] = weatherCodeToUi(code);

            clearTimeout(loadingGuard);
            statusEl.innerHTML = `
              <span class="weather-emoji">${emoji}</span>
              <span class="weather-temp"> ${temp}&deg;F</span>
              <div class="weather-desc">${label}</div>
              <div class="weather-meta">Current location</div>
            `;
          } catch {
            clearTimeout(loadingGuard);
            showError("Could not load weather right now.");
          }
        },
        (error) => {
          clearTimeout(loadingGuard);
          if (error.code === error.PERMISSION_DENIED) {
            showError("Enable location to see your weather.");
          } else if (error.code === error.TIMEOUT) {
            showError("Location timed out. Please try again.");
          } else {
            showError("Could not access your location right now.");
          }
        },
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 }
      );
    })();
  </script>

  <script src="js/main.js"></script>
</body>
</html>
