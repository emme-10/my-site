<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emme Enojado</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Oxygen+Mono&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/styles.css" />

  <!-- Open Graph / social preview -->
  <meta property="og:title" content="Emme Enojado — Product Designer" />
  <meta property="og:description" content="Product designer with 5+ years delivering end-to-end solutions across finance, government, and more." />
  <meta property="og:image" content="https://emme-e-site.vercel.app/assets/og-preview.png" />
  <meta property="og:url" content="https://emme-e-site.vercel.app/index.html" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://emme-e-site.vercel.app/assets/og-preview.png" />
</head>
<body>
  <header>
    <nav class="nav-pill" aria-label="Main navigation">
      <a href="index.html" class="nav-identity">
        <img src="assets/profile.jpg" alt="Emme Enojado" class="profile-pic" />
        <span class="nav-name">Emme Enojado</span>
      </a>
      <div class="nav-separator" aria-hidden="true"></div>
      <ul>
        <li><a href="index.html" aria-current="page">Work</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="mailto:emme.enojado@slalom.com">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="projectCanvas" class="field" aria-label="Interactive project map">
    <svg
      id="connectionLayer"
      class="connection-layer"
      aria-hidden="true"
      preserveAspectRatio="none"
    ></svg>
  </main>

  <section class="weather-card" id="weatherCard" aria-live="polite">
    <p id="weatherStatus">Locating…</p>
  </section>

  <div class="clock-widget" id="clockWidget" role="timer"></div>

  <section class="modal" id="projectModal" aria-hidden="true">
    <article class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-top">
        <div>
          <h2 class="modal-title" id="modalTitle">Project</h2>
          <p class="modal-tag" id="modalTag">Tag</p>
        </div>
        <button class="modal-close" id="modalClose" type="button" aria-label="Close project details">Close</button>
      </div>
      <p class="modal-desc" id="modalDesc">Placeholder description.</p>
    </article>
  </section>

  <script src="js/transitions.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
