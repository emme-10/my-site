<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emme Enojado</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Oxygen+Mono&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <h1>Emme Enojado</h1>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="work.html">Work</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="projectCanvas" class="field" aria-label="Interactive project map">
    <svg
      id="connectionLayer"
      class="connection-layer"
      aria-hidden="true"
      preserveAspectRatio="none"
    ></svg>
  </main>

  <section class="weather-card" id="weatherCard" aria-live="polite">
    <h2 class="weather-title">Local Weather</h2>
    <p id="weatherStatus">Finding your garden skies…</p>
  </section>

  <section class="modal" id="projectModal" aria-hidden="true">
    <article class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-top">
        <div>
          <h2 class="modal-title" id="modalTitle">Project</h2>
          <p class="modal-tag" id="modalTag">Tag</p>
        </div>
        <button class="modal-close" id="modalClose" type="button" aria-label="Close project details">Close</button>
      </div>
      <p class="modal-desc" id="modalDesc">Placeholder description.</p>
    </article>
  </section>

  <div class="portfolio-item">
    <img src="images/project.jpg" alt="Project title">

    <div class="cap">
      <div class="bn">Project Title</div>
      <div class="bi">Short project subtitle</div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
