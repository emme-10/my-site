<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Emme Enojado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Oxygen+Mono&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <header>
      <nav class="nav-pill" aria-label="Main navigation">
        <a href="index.html" class="nav-identity">
          <img src="assets/profile.jpg" alt="Emme Enojado" class="profile-pic" />
          <span class="nav-name">Emme Enojado</span>
        </a>
        <div class="nav-separator" aria-hidden="true"></div>
        <ul>
          <li><a href="index.html">Work</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="mailto:emme.enojado@slalom.com">Contact</a></li>
        </ul>
      </nav>
    </header>
    <main>
        <form action="#" method="post" id="contact-form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Send Message</button>
        </form>
        <section>
            <h2>Other Ways to Reach Me</h2>
            <p>Email: <a href="mailto:emme@example.com">emme@example.com</a></p>
            <p>LinkedIn: <a href="https://www.linkedin.com/in/emme" target="_blank">linkedin.com/in/emme</a></p>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Emme. All rights reserved.</p>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
